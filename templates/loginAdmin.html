<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>loginAdmin</title>
    <link rel="stylesheet" href="/ParqueaYa-/estilos/login.css">
</head>
<body>
<form id="form-login">
    <script src="/ParqueaYa-/scripts/login.js" defer></script>
    <div class="contenedor-principal">
        
        <div class="parte-superior">
            <img src="/ParqueaYa-/Imagenes/parqueaYalogin.png" alt="" width="120px">
            <h1>ParqueaYa!</h1>
            <p>acceso al sistema</p>
        </div>
        <div class="btns">
            <div class="credenciales">
                <img src="/ParqueaYa-/Imagenes/usuario.png" alt="" width="30px">
                <input 
                     type="text"
                        id="usuario"
                        name="usuario"
                        placeholder="Usuario"
                        autocomplete="username"
                        required>
            </div>
            <div class="credenciales">
                <img src="/ParqueaYa-/Imagenes/candado.png" alt="" width="30px">
                <input  
                        type="password"
                        id="contrasena"
                        name="contrasena"
                        placeholder="Contraseña"
                        autocomplete="current-password"
                        required>
            </div>
            <input 
                    type="submit"
                    value="Iniciar sesión"
                    class="inicio-sesion">

            <p id="mensaje-login" role="status"></p>
        </div>
    </div>
</form>
</body>
</html>
